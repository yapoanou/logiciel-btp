<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTP Pro CI - Pointage</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e67e22;
            --bg: #f0f2f5;
            --success: #27ae60;
            --danger: #e74c3c;
            --glass: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f0f2f5 0%, #c3cfe2 100%);
            margin: 0; padding-bottom: 50px; color: var(--primary);
            min-height: 100vh;
        }

        header {
            background: var(--primary); color: white; padding: 25px; text-align: center;
            border-bottom-left-radius: 30px; border-bottom-right-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
        }

        .container { width: 90%; max-width: 500px; margin: 20px auto 0; }

        .main-card {
            background: var(--glass); padding: 25px; border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.3);
        }

        h2 { font-size: 1.2rem; margin-bottom: 20px; text-align: center; }
        label { display: block; font-weight: bold; margin: 15px 0 5px; font-size: 0.9rem; color: #555; }

        select {
            width: 100%; padding: 15px; border-radius: 15px; border: 2px solid #ddd;
            font-size: 1rem; background: white; outline: none; cursor: pointer;
            box-sizing: border-box;
        }

        .status-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px;
        }

        .btn-status {
            padding: 15px; border: none; border-radius: 15px; font-weight: bold;
            color: white; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-size: 1rem;
        }

        .btn-present { background: var(--success); box-shadow: 0 4px 10px rgba(39,174,96,0.3); }
        .btn-absent  { background: var(--danger);  box-shadow: 0 4px 10px rgba(231,76,60,0.3); }
        .btn-status.inactif { opacity: 0.4; }

        .btn-valider {
            width: 100%; padding: 20px; background: var(--primary); color: white;
            border: none; border-radius: 20px; font-weight: bold; font-size: 1.1rem;
            margin-top: 25px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
        }
        .btn-valider:disabled { background: #95a5a6; cursor: not-allowed; }

        .history-section { margin-top: 35px; }
        .history-item {
            background: white; padding: 18px; border-radius: 20px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-left: 6px solid var(--success);
        }
        .history-item.absent { border-left-color: var(--danger); }

        .badge {
            padding: 6px 12px; border-radius: 10px; font-size: 0.75rem; font-weight: bold; color: white;
        }
        .badge-present { background: var(--success); }
        .badge-absent  { background: var(--danger); }

        .nav-back { position: absolute; left: 20px; top: 25px; color: white; text-decoration: none; font-size: 1.2rem; }
    </style>
</head>
<body>

<header>
    <a href="chef-accueil.html" class="nav-back"><i class="fas fa-arrow-left"></i></a>
    <h1 style="margin:0; font-size: 1.3rem;">📅 Pointage Équipe</h1>
</header>

<div class="container">
    <div class="main-card">
        <h2>Saisie de présence</h2>
        
        <label><i class="fas fa-hard-hat"></i> Chantier</label>
        <select id="select-chantier" onchange="chargerHistorique()">
            <option>Chargement...</option>
        </select>

        <label><i class="fas fa-user"></i> Ouvrier</label>
        <select id="select-ouvrier">
            <option>Chargement...</option>
        </select>

        <label><i class="fas fa-info-circle"></i> Statut du jour</label>
        <div class="status-grid">
            <button class="btn-status btn-present" id="stat-present" onclick="setStatut('present')">
                <i class="fas fa-check-circle"></i> Présent
            </button>
            <button class="btn-status btn-absent inactif" id="stat-absent" onclick="setStatut('absent')">
                <i class="fas fa-times-circle"></i> Absent
            </button>
        </div>

        <button class="btn-valider" onclick="enregistrerPointage()" id="btn-final">
            ENREGISTRER LE POINTAGE
        </button>
    </div>

    <div class="history-section">
        <h3 style="margin-left:10px; font-size:1rem;"><i class="fas fa-history"></i> Pointages du jour :</h3>
        <div id="historique"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase.js"></script>
<script>

let ENTREPRISE_ID = null;
let AUTEUR_ID     = null;
let statutSelectionne = 'present';

const AUJOURDHUI = new Date().toLocaleDateString('en-CA');

function setStatut(s) {
    statutSelectionne = s;
    document.getElementById('stat-present').classList.toggle('inactif', s !== 'present');
    document.getElementById('stat-absent').classList.toggle('inactif',  s !== 'absent');
}

async function init() {
    const session = await window.requireAuth();
    if (!session) return;

    const profile = await window.getUserProfile();
    if (!profile) return;

    ENTREPRISE_ID = profile.entreprise_id;
    AUTEUR_ID     = (await window.sb.auth.getUser()).data.user?.id;

    try {
        const [resC, resE] = await Promise.all([
            window.sb.from('chantiers')
                .select('id, nom_chantier')
                .eq('entreprise_id', ENTREPRISE_ID)
                .eq('statut', 'en_cours'),
            window.sb.from('equipe')
                .select('id, nom')
                .eq('entreprise_id', ENTREPRISE_ID)
                .eq('actif', true)
                .order('nom')
        ]);

        const selectChantier = document.getElementById('select-chantier');
        const selectOuvrier  = document.getElementById('select-ouvrier');

        selectChantier.innerHTML = resC.data?.length > 0
            ? resC.data.map(c => `<option value="${c.id}">${c.nom_chantier}</option>`).join('')
            : '<option value="">Aucun chantier en cours</option>';

        selectOuvrier.innerHTML = resE.data?.length > 0
            ? resE.data.map(o => `<option value="${o.id}">${o.nom}</option>`).join('')
            : '<option value="">Aucun ouvrier trouvé</option>';

        setStatut('present');
        chargerHistorique();

    } catch (err) {
        console.error("Erreur init:", err);
    }
}

async function enregistrerPointage() {
    const btn         = document.getElementById('btn-final');
    const equipe_id   = document.getElementById('select-ouvrier').value;
    const chantier_id = document.getElementById('select-chantier').value;

    if (!equipe_id || equipe_id === 'Aucun ouvrier trouvé')   return alert("Veuillez sélectionner un ouvrier valide.");
    if (!chantier_id || chantier_id === 'Aucun chantier en cours') return alert("Veuillez sélectionner un chantier.");

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enregistrement...';

    const { error } = await window.sb.from('pointage').upsert({
        entreprise_id: ENTREPRISE_ID,
        chantier_id:   chantier_id,
        equipe_id:     equipe_id,
        date_pointage: AUJOURDHUI,
        statut:        statutSelectionne,
        auteur_id:     AUTEUR_ID
    }, {
        onConflict: 'entreprise_id,chantier_id,equipe_id,date_pointage'
    });

    if (error) {
        alert("❌ " + error.message);
        console.error(error);
    } else {
        btn.style.background = "#27ae60";
        btn.innerHTML = "✅ POINTAGE BIEN REÇU";
        setTimeout(() => {
            btn.style.background = "";
            btn.innerText = "ENREGISTRER LE POINTAGE";
        }, 2000);
        chargerHistorique();
    }

    btn.disabled = false;
}

async function chargerHistorique() {
    const chantier_id = document.getElementById('select-chantier').value;
    if (!chantier_id) return;

    const { data, error } = await window.sb
        .from('pointage')
        .select('statut, equipe:equipe_id(nom)')
        .eq('date_pointage', AUJOURDHUI)
        .eq('chantier_id', chantier_id);

    const div = document.getElementById('historique');

    if (data && data.length > 0) {
        div.innerHTML = data.map(p => `
            <div class="history-item ${p.statut === 'absent' ? 'absent' : ''}">
                <span style="font-weight:bold;">${p.equipe?.nom || 'Ouvrier'}</span>
                <span class="badge ${p.statut === 'present' ? 'badge-present' : 'badge-absent'}">
                    ${p.statut === 'present' ? 'Présent' : 'Absent'}
                </span>
            </div>
        `).join('');
    } else {
        div.innerHTML = `
            <div style="text-align:center; padding:15px; color:#7f8c8d; background:white; border-radius:15px;">
                Aucun pointage pour ce chantier aujourd'hui.
            </div>`;
    }
}

async function deconnexion() {
    await window.sb.auth.signOut();
    localStorage.clear();
    window.location.href = 'login.html';
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
