<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTP Pro CI - Gestion Achats</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #f0f2f5;
            --success: #27ae60;
            --glass: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f0f2f5 0%, #c3cfe2 100%);
            margin: 0; padding-bottom: 50px; color: var(--primary);
            min-height: 100vh;
        }

        header {
            background: var(--primary); color: white; padding: 25px; text-align: center;
            border-bottom-left-radius: 30px; border-bottom-right-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
        }

        .container { width: 90%; max-width: 500px; margin: -20px auto 0; }

        .main-card {
            background: var(--glass); padding: 25px; border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
        }

        h2 { font-size: 1.2rem; margin-bottom: 20px; text-align: center; }
        label { display: block; font-weight: bold; margin: 15px 0 5px; font-size: 0.85rem; color: #555; }

        input, select {
            width: 100%; padding: 15px; border-radius: 15px; border: 2px solid #ddd;
            font-size: 1rem; background: white; box-sizing: border-box; outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--accent); }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .btn-valider {
            width: 100%; padding: 20px; background: var(--accent); color: white;
            border: none; border-radius: 20px; font-weight: bold; font-size: 1.1rem;
            margin-top: 25px; cursor: pointer; box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
            transition: 0.3s;
        }

        .btn-valider:disabled { background: #95a5a6; }

        .purchase-item {
            background: white; padding: 18px; border-radius: 20px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-left: 6px solid var(--accent);
        }

        .purchase-info b { display: block; font-size: 1rem; }
        .purchase-info span { font-size: 0.8rem; color: #7f8c8d; }
        .price-tag { font-weight: bold; color: var(--success); font-size: 1.1rem; }

        .nav-back { position: absolute; left: 20px; top: 25px; color: white; text-decoration: none; }
    </style>
</head>
<body>

<header>
    <a href="chef-accueil.html" class="nav-back"><i class="fas fa-arrow-left"></i></a>
    <h1 style="margin:0; font-size: 1.3rem;">📦 Achats & Stocks</h1>
</header>

<div class="container">
    <div class="main-card">
        <h2>Nouvel Achat</h2>
        
        <label><i class="fas fa-building"></i> Chantier</label>
        <select id="select-chantier" onchange="chargerHistoriqueAchats()">
            <option>Chargement...</option>
        </select>

        <label><i class="fas fa-shopping-basket"></i> Désignation</label>
        <input type="text" id="designation" placeholder="Ex: 50 sacs de ciment">

        <div class="row">
            <div>
                <label><i class="fas fa-layer-group"></i> Quantité</label>
                <input type="number" id="quantite" placeholder="Ex: 10">
            </div>
            <div>
                <label><i class="fas fa-money-bill-wave"></i> Prix Total (F)</label>
                <input type="number" id="prix" placeholder="Ex: 50000">
            </div>
        </div>

        <label><i class="fas fa-credit-card"></i> Mode de Paiement</label>
        <select id="mode-paiement">
            <option value="Espèces">💵 Espèces</option>
            <option value="Mobile Money">📱 Mobile Money</option>
            <option value="Chèque">✍️ Chèque</option>
        </select>

        <button class="btn-valider" onclick="enregistrerAchat()" id="btn-final">
            VALIDER L'ACHAT
        </button>
    </div>

    <div class="history-section" style="margin-top: 30px;">
        <h3 style="margin-left: 10px; font-size: 1rem;"><i class="fas fa-list-ul"></i> Achats du jour :</h3>
        <div id="historique-achats"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase.js"></script>
<script src="app-core.js"></script>
<script>
   

let ENTREPRISE_ID = null;
let AUTEUR_ID = null;

async function init() {
    const session = await window.requireAuth();
    if (!session) return;

    const profile = await window.getUserProfile();
    if (!profile) return;

    ENTREPRISE_ID = profile.entreprise_id;
    AUTEUR_ID     = (await sb.auth.getUser()).data.user?.id;

    const { data: chantiers } = await sb
        .from('chantiers')
        .select('id, nom_chantier')
        .eq('entreprise_id', ENTREPRISE_ID);

    const select = document.getElementById('select-chantier');
    if (chantiers && chantiers.length > 0) {
        select.innerHTML = chantiers.map(c =>
            `<option value="${c.id}">${c.nom_chantier}</option>`
        ).join('');
        chargerHistoriqueAchats();
    } else {
        select.innerHTML = "<option value=''>Aucun chantier actif</option>";
    }
}

async function enregistrerAchat() {
    const btn         = document.getElementById('btn-final');
    const designation = document.getElementById('designation').value.trim();
    const quantite    = Math.max(1, Number(document.getElementById('quantite').value) || 1);
    const prix        = Number(document.getElementById('prix').value);
    const chantier_id = document.getElementById('select-chantier').value;
    const modeRaw     = document.getElementById('mode-paiement').value;

    if (!designation || !prix || !chantier_id) return alert("Champs obligatoires manquants.");
    if (!AUTEUR_ID) return alert("Session invalide, reconnectez-vous.");

    // Convertir le mode en valeur enum
    const modeMap = {
        'Espèces':      'especes',
        'Mobile Money': 'mobile_money',
        'Chèque':       'cheque'
    };
    const mode = modeMap[modeRaw] || 'especes';

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enregistrement...';

    const { error } = await sb.from('materiaux').insert([{
        designation:   designation,
        quantite:      quantite,
        prix_total:    prix,
        prix_unitaire: Math.round(prix / quantite),
        mode:          mode,
        chantier_id:   chantier_id,
        entreprise_id: ENTREPRISE_ID,
        auteur_id:     AUTEUR_ID
    }]);

    if (error) {
        alert("❌ " + error.message);
    } else {
        alert("✅ Achat enregistré !");
        document.getElementById('designation').value = '';
        document.getElementById('quantite').value    = '';
        document.getElementById('prix').value        = '';
        chargerHistoriqueAchats();
    }

    btn.disabled = false;
    btn.innerText = "VALIDER L'ACHAT";
}

async function chargerHistoriqueAchats() {
    const chantier_id = document.getElementById('select-chantier').value;
    if (!chantier_id) return;

    const startOfDay = new Date();
    startOfDay.setHours(0, 0, 0, 0);

    const { data, error } = await sb
        .from('materiaux')
        .select('*')
        .eq('chantier_id', chantier_id)
        .gte('created_at', startOfDay.toISOString())
        .order('created_at', { ascending: false });

    if (error) console.error(error);

    const div = document.getElementById('historique-achats');
    if (data && data.length > 0) {
        div.innerHTML = data.map(m => `
            <div class="purchase-item">
                <div class="purchase-info">
                    <b>${(m.designation || '').trim()} (x${Number(m.quantite) || 1})</b>
                    <span><i class="fas fa-clock"></i> ${new Date(m.created_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}</span>
                </div>
                <div class="price-tag">
                    ${Number(m.prix_total ?? (Number(m.prix_unitaire) * (Number(m.quantite) || 1))).toLocaleString()} F
                </div>
            </div>
        `).join('');
    } else {
        div.innerHTML = `
            <div style="text-align:center; padding:20px; color:#7f8c8d; background:white; border-radius:20px;">
                Aucune dépense enregistrée aujourd'hui.
            </div>`;
    }
}

async function deconnexion() {
    await sb.auth.signOut();
    localStorage.clear();
    window.location.href = 'login.html';
}

window.onload = init;
</script>
</body>
</html>
