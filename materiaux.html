<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTP Pro CI - Matériaux & Dépenses</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #1e293b; --ci-orange: #ff8200; --success: #059669; --bg: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); margin: 0; padding-bottom: 80px; }
        
        nav { background: var(--primary); padding: 0.75rem; display: flex; overflow-x: auto; gap: 8px; white-space: nowrap; scrollbar-width: none; }
        nav::-webkit-scrollbar { display: none; }
        nav a { color: #cbd5e1; text-decoration: none; padding: 8px 16px; border-radius: 12px; font-size: 0.85rem; font-weight: 600; transition: 0.3s; }
        nav a:hover { background: rgba(255,255,255,0.1); color: white; }
        .active-link { background: var(--ci-orange) !important; color: white !important; }

        .container { max-width: 500px; margin: 20px auto; padding: 0 16px; }
        .card { background: white; padding: 24px; border-radius: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid #f1f5f9; }
        
        label { display: block; margin-bottom: 8px; font-weight: 700; color: #64748b; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
        input, select { width: 100%; padding: 14px; border: 2px solid #f1f5f9; border-radius: 16px; font-size: 1rem; outline: none; transition: 0.3s; background: #f8fafc; color: var(--primary); font-weight: 600; box-sizing: border-box; }
        input:focus, select:focus { border-color: var(--ci-orange); background: white; box-shadow: 0 0 0 4px rgba(255,130,0,0.1); }
        
        .btn-add { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 18px; font-weight: 800; cursor: pointer; font-size: 1rem; transition: 0.3s; margin-top: 10px; }
        .btn-add:active { transform: scale(0.98); }
        .btn-add:disabled { background: #94a3b8; cursor: not-allowed; }
        
        .item-depense { background: white; padding: 16px; border-radius: 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #f1f5f9; transition: 0.2s; }
        .item-depense:hover { border-color: var(--ci-orange); }
        .price { font-weight: 900; color: var(--primary); font-size: 1.1rem; text-align: right; }
        
        .status-msg { display: none; margin-top: 15px; padding: 14px; border-radius: 14px; font-weight: 600; text-align: center; font-size: 0.9rem; }
        .status-success { background: #e8f8ef; color: #0f7a3d; border: 1px solid #b7e4c7; }
        .status-error { background: #fdecec; color: #b42318; border: 1px solid #f7b9b9; }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-list { animation: slideUp 0.4s ease-out; }
    </style>
</head>
<body>

    <nav>
        <a href="tableau-de-bord.html" style="background:var(--ci-orange)">📊 Dashboard</a>
        <a href="equipe.html">👥 Équipe</a>
        <a href="chantiers.html">🏗️ Chantiers</a>
        <a href="pointage.html">📅 Pointage</a>
        <a href="materiaux.html">📦 Matériaux</a>
        <a href="bilan.html">💰 Bilan</a>
        <a href="journal.html">📝 Journal</a>
        <a href="photos.html">📸 Photos</a>
        <a href="stats.html">📈 Stats</a>
        <a href="profil.html">⚙️ Profil</a>

        <!-- Cloche -->
        <div class="notif-cloche" id="notif-cloche" onclick="togglePanel()">
            🔔
            <div class="notif-badge" id="notif-badge"></div>
        </div>

        <button onclick="deconnexion()" class="logout-btn">Sortir</button>
    </nav>


    <div class="container">
        <div class="card">
            <h3 class="text-xl font-black mb-6 text-slate-800 flex items-center justify-between">
                <span>ENREGISTRER ACHAT</span>
                <i class="fas fa-receipt text-orange-500"></i>
            </h3>
            
            <div class="space-y-4">
                <div>
                    <label>Chantier</label>
                    <select id="select-chantier"></select>
                </div>
                <div>
                    <label>Article / Matériau</label>
                    <input type="text" id="nom-materiau" placeholder="Ex: Ciment, Sable, Pointes...">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label>Quantité</label>
                        <input type="number" id="quantite" value="1" min="1">
                    </div>
                    <div>
                        <label>Total (F CFA)</label>
                        <input type="number" id="prix-total" placeholder="Montant">
                    </div>
                </div>
                
                <div id="status-msg" class="status-msg"></div>

                <button class="btn-add" onclick="ajouterMateriau()" id="btn-valider">
                    VALIDER L'ACHAT
                </button>
            </div>
        </div>

        <div class="mt-8">
            <div class="flex items-center justify-between mb-4 px-2">
                <h3 class="font-black text-slate-700 flex items-center gap-2">
                    <i class="fas fa-history text-slate-400"></i> FLUX RÉCENTS
                </h3>
                <span class="text-[10px] bg-slate-200 text-slate-500 px-2 py-1 rounded-full font-bold">TOP 15</span>
            </div>
            <div id="liste-depenses" class="space-y-3">
                <div class="text-center py-10">
                    <i class="fas fa-circle-notch fa-spin text-orange-500 text-2xl"></i>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="supabase.js"></script>
    <script>
let ENTREPRISE_ID = null;
let AUTEUR_ID = null;
let nomsChantiers = {};

async function init() {
    const session = await window.requireAuth();
    if (!session) return;

    const profile = await window.getUserProfile();
    if (!profile) return;

    ENTREPRISE_ID = profile.entreprise_id;
    AUTEUR_ID = (await window.sb.auth.getUser()).data.user?.id;

    try {
        const { data: chantiers } = await window.sb
            .from('chantiers')
            .select('id, nom_chantier')
            .eq('entreprise_id', ENTREPRISE_ID);

        const selectElement = document.getElementById('select-chantier');
        if (chantiers?.length > 0) {
            selectElement.innerHTML = '<option value="">-- Choisir un chantier --</option>' +
                chantiers.map(c => {
                    nomsChantiers[c.id] = c.nom_chantier;
                    return `<option value="${c.id}">${c.nom_chantier}</option>`;
                }).join('');
        } else {
            selectElement.innerHTML = '<option value="">Aucun chantier actif</option>';
        }

        chargerMateriaux();
    } catch (err) {
        console.error("Init Error:", err);
    }
}

async function ajouterMateriau() {
    const chantier_id = document.getElementById('select-chantier').value;
    const nom         = document.getElementById('nom-materiau').value.trim();
    const qte         = Math.max(1, Number(document.getElementById('quantite').value) || 1);
    const total       = Number(document.getElementById('prix-total').value);

    if (!nom || !total || !chantier_id) {
        afficherMessage("⚠️ Remplissez tous les champs.", 'error');
        return;
    }

    const btn = document.getElementById('btn-valider');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-sync fa-spin"></i> ENREGISTREMENT...';

    try {
        const { error } = await window.sb.from('materiaux').insert([{
            entreprise_id: ENTREPRISE_ID,
            chantier_id:   chantier_id,
            auteur_id:     AUTEUR_ID,
            designation:   nom,
            quantite:      qte,
            prix_total:    total,
            prix_unitaire: Math.round(total / qte),
            mode:          'especes'
        }]);

        if (error) throw error;

        document.getElementById('nom-materiau').value = '';
        document.getElementById('prix-total').value   = '';
        document.getElementById('quantite').value     = '1';
        afficherMessage("✅ Achat validé !");
        chargerMateriaux();

    } catch (err) {
        afficherMessage("❌ " + err.message, 'error');
    } finally {
        btn.disabled = false;
        btn.innerHTML = "VALIDER L'ACHAT";
    }
}

async function chargerMateriaux() {
    const container = document.getElementById('liste-depenses');
    try {
        const { data, error } = await window.sb
            .from('materiaux')
            .select('*')
            .eq('entreprise_id', ENTREPRISE_ID)
            .order('created_at', { ascending: false })
            .limit(15);

        if (error) throw error;

        if (data && data.length > 0) {
            container.innerHTML = data.map(d => `
                <div class="item-depense animate-list">
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-[9px] bg-orange-100 text-orange-600 px-2 py-0.5 rounded-full font-black uppercase">
                                ${nomsChantiers[d.chantier_id] || 'Chantier'}
                            </span>
                            <span class="text-[10px] text-slate-400 font-medium italic">
                                ${new Date(d.created_at).toLocaleDateString('fr-FR')}
                            </span>
                        </div>
                        <div class="font-bold text-slate-800 text-sm uppercase">
                            ${(d.designation || '').trim()}
                            <span class="text-slate-400 font-normal normal-case ml-1">(x${d.quantite})</span>
                        </div>
                    </div>
                    <div class="price">
                        ${Number(d.prix_total ?? (Number(d.prix_unitaire) * (Number(d.quantite) || 1))).toLocaleString('fr-FR')}
                        <div class="text-[9px] text-slate-400 font-bold uppercase tracking-tighter">FCFA</div>
                    </div>
                </div>
            `).join('');
        } else {
            container.innerHTML = `
                <div class="text-center p-8 border-2 border-dashed border-slate-200 rounded-3xl">
                    <p class="text-slate-400 text-sm font-medium">Aucune dépense enregistrée.</p>
                </div>`;
        }
    } catch (err) {
        container.innerHTML = "<p class='text-red-500 text-center font-bold'>Problème de connexion.</p>";
    }
}

function afficherMessage(message, type = 'success') {
    const msgDiv = document.getElementById('status-msg');
    if (!msgDiv) return;
    msgDiv.innerText = message;
    msgDiv.style.display = 'block';
    msgDiv.className = `status-msg ${type === 'success' ? 'status-success' : 'status-error'}`;
    setTimeout(() => { msgDiv.style.display = 'none'; }, 5000);
}

async function deconnexion() {
    await window.sb.auth.signOut();
    localStorage.clear();
    window.location.href = 'login.html';
}

window.onload = init;
    </script>
</body>
</html>
