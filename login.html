<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BâtiOS - Connexion</title>
<meta name="theme-color" content="#fffaf3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--o:#ff7a00;--g:#0f9d58;--n:#fffaf3;--n2:#ffffff;--tx:#1c1510;--mut:#6e6256;--bd:rgba(60,35,10,.12);--shadow:0 24px 60px -30px rgba(120,60,0,.35)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--n);color:var(--tx);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:36px 18px;letter-spacing:-.012em;line-height:1.6;
 background-image:radial-gradient(46% 50% at 10% 12%,rgba(255,138,31,.26),transparent 72%),radial-gradient(38% 44% at 92% 88%,rgba(15,157,88,.14),transparent 72%),radial-gradient(36% 36% at 65% 0%,rgba(255,200,140,.3),transparent 70%)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(60,35,10,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(60,35,10,.07) 1px,transparent 1px);background-size:68px 68px;opacity:.5;mask-image:radial-gradient(ellipse at center,#000 15%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at center,#000 15%,transparent 75%)}
.tri{background:linear-gradient(90deg,#ff7a00,#ffb347 68%,#0f9d58)}
.top{position:fixed;top:0;left:0;right:0;height:3px;z-index:50}
.wrap{position:relative;width:100%;max-width:440px}
.back{display:inline-block;color:var(--mut);font-size:.85rem;text-decoration:none;margin-bottom:16px;transition:color .2s}
.back:hover{color:var(--o)}
.card{background:var(--n2);border:1px solid var(--bd);border-radius:16px;padding:34px 30px;box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem;letter-spacing:-.04em}
.logo i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-style:normal;background:linear-gradient(135deg,var(--o),var(--g));box-shadow:0 8px 20px -8px rgba(255,122,0,.6)}
.logo em{font-style:normal}
.logo em span{color:var(--g)}
h1{font-size:1.75rem;font-weight:800;letter-spacing:-.05em;line-height:1.15;margin-top:22px}
.subtitle{color:var(--mut);font-size:.93rem;margin:6px 0 20px}
#error-box{display:none;background:rgba(239,68,68,.09);color:#b91c1c;border:1px solid rgba(239,68,68,.35);border-radius:10px;padding:12px 14px;margin-bottom:6px;font-size:.88rem;font-weight:500}
label{display:block;font-size:.8rem;font-weight:600;color:var(--mut);margin:14px 0 6px}
input{width:100%;padding:13px 14px;background:#fffdf9;color:var(--tx);border:1px solid rgba(60,35,10,.18);border-radius:9px;font:inherit;font-size:.95rem;outline:0;transition:.2s}
input::placeholder{color:#a89c8e}
input:focus{border-color:var(--o);background:#fff;box-shadow:0 0 0 3px rgba(255,122,0,.18)}
.forgot-password{text-align:right;margin-top:8px}
.forgot-password a{color:var(--o);text-decoration:none;font-size:.82rem;font-weight:600}
.forgot-password a:hover{text-decoration:underline}
.security-box{display:flex;gap:13px;align-items:flex-start;margin-top:18px;padding:15px;border-radius:11px;background:rgba(15,157,88,.09);border:1px solid rgba(15,157,88,.35)}
.security-box .ic{font-size:1.4rem}
.security-text{font-size:.8rem;color:#4d5a50;line-height:1.55}
.security-text b{display:block;color:#0b7a45;font-size:.86rem;margin-bottom:2px}
#loader{display:none;align-items:center;justify-content:center;gap:10px;margin-top:16px;color:#0b7a45;font-weight:600;font-size:.9rem}
#loader.visible{display:flex}
.spinner{flex:none;width:18px;height:18px;border-radius:50%;border:3px solid rgba(60,35,10,.12);border-top-color:var(--g);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#auth-btn{width:100%;margin-top:20px;padding:15px;border:0;border-radius:9px;background:linear-gradient(135deg,#ff8a1f,#ff6a00);color:#fff;font:700 .95rem inherit;font-family:inherit;cursor:pointer;box-shadow:0 10px 24px -10px rgba(255,106,0,.6);transition:.25s}
#auth-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 16px 30px -10px rgba(255,106,0,.65)}
#auth-btn:disabled{background:#cfc3b6;box-shadow:none;cursor:not-allowed}
.register-link{display:block;text-align:center;margin-top:20px;color:var(--mut);font-size:.88rem}
.register-link a{color:var(--o);text-decoration:none;font-weight:700}
.register-link a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--o);outline-offset:2px}
@media(max-width:480px){.card{padding:26px 20px}h1{font-size:1.5rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:1.6s!important}}
</style>
</head>
<body>
<div class="top tri"></div>

<div class="wrap">
    <a href="index.html" class="back">← Retour à l'accueil</a>
    <div class="card">
        <div class="logo"><i>🏗️</i><em>Bâti<span>OS</span></em></div>
        <h1>Bon retour</h1>
        <p class="subtitle">Connectez-vous à votre espace sécurisé.</p>

        <div id="error-box"></div>

        <form onsubmit="event.preventDefault(); gererAuth();">
            <label for="email">Email professionnel</label>
            <input type="email" id="email" placeholder="vous@entreprise.com" autocomplete="username" required>
            <label for="password">Mot de passe</label>
            <input type="password" id="password" placeholder="Votre mot de passe" autocomplete="current-password" required>
            <div class="forgot-password">
                <a href="reset-password.html">Mot de passe oublié ?</a>
            </div>

            <div class="security-box">
                <span class="ic">🛡️</span>
                <div class="security-text">
                    <b>Accès sécurisé RLS activé</b>
                    Vos données sont isolées et protégées par chiffrement.
                </div>
            </div>

            <div id="loader">
                <div class="spinner"></div>
                Connexion en cours...
            </div>

            <button type="submit" id="auth-btn">SE CONNECTER</button>
        </form>

        <span class="register-link">
            Pas encore inscrit ? <a href="inscription.html">Créer un compte</a>
        </span>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase.js"></script>
<script>
    async function recupererProfil(userId) {
        const { data, error } = await window.sb
            .from('profiles')
            .select('full_name, role, entreprise_id')
            .eq('id', userId)
            .single();
        if (error) return null;
        return data;
    }

    async function redirigerSiDejaConnecte() {
        const { data: { user } } = await window.sb.auth.getUser();
        if (!user) return;
        const profile = await recupererProfil(user.id);
        if (!profile) return;
        window.location.replace(profile.role === 'pdg' ? 'tableau-de-bord.html' : 'interface-chef.html');
    }

    async function gererAuth() {
        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const errorBox = document.getElementById('error-box');
        const loader   = document.getElementById('loader');
        const btn      = document.getElementById('auth-btn');

        if (!email || !password) {
            errorBox.innerText = "❌ Veuillez remplir tous les champs.";
            errorBox.style.display = "block";
            return;
        }

        btn.disabled = true;
        errorBox.style.display = "none";
        loader.classList.add('visible');

        try {
            const { data: authData, error: authError } = await window.sb.auth.signInWithPassword({ email, password });

            if (authError) throw new Error("Email ou mot de passe incorrect.");
            if (!authData.user) throw new Error("Impossible de se connecter.");

            const profile = await recupererProfil(authData.user.id);
            if (!profile) throw new Error("Profil introuvable. Contactez l'administrateur.");

            localStorage.setItem('user_id',       authData.user.id);
            localStorage.setItem('user_email',    email);
            localStorage.setItem('user_nom',      profile.full_name || 'Utilisateur');
            localStorage.setItem('user_role',     profile.role);
            localStorage.setItem('entreprise_id', profile.entreprise_id || '');

            loader.innerHTML = '✅ Connexion réussie...';

            setTimeout(() => {
                window.location.href = profile.role === 'pdg' ? 'tableau-de-bord.html' : 'chef-accueil.html';
            }, 1000);

        } catch (err) {
            errorBox.innerText = "❌ " + (err.message || "Erreur de connexion.");
            errorBox.style.display = "block";
            loader.classList.remove('visible');
            btn.disabled = false;
        }
    }

    window.addEventListener('load', redirigerSiDejaConnecte);
</script>
</body>
</html>
