<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTP PRO CI - Connexion</title>
    <style>
        :root {
            --primary: #009e49;
            --secondary: #2c3e50;
            --accent: #ff8200;
            --safe: #2ecc71;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--secondary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center;
            position: relative;
        }

        .flag-mini {
            height: 4px;
            display: flex;
            margin-bottom: 20px;
            border-radius: 2px;
            overflow: hidden;
        }
        .orange { background: var(--accent); flex: 1; }
        .white  { background: #eee; flex: 1; }
        .green  { background: var(--primary); flex: 1; }

        h2 { color: var(--secondary); margin-bottom: 5px; font-size: 1.8rem; }
        p.subtitle { color: #7f8c8d; margin-bottom: 25px; font-size: 0.95rem; }

        #error-box {
            display: none;
            background: #fdecea;
            color: #c0392b;
            border: 1px solid #f5c6cb;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 5px rgba(0,158,73,0.2);
        }

        .forgot-password {
            text-align: right;
            margin-top: -5px;
            margin-bottom: 10px;
        }
        .forgot-password a {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .forgot-password a:hover { text-decoration: underline; }

        #loader {
            display: none;
            text-align: center;
            color: var(--primary);
            font-weight: bold;
            margin: 10px 0;
            font-size: 0.9rem;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        #loader.visible { display: flex; }

        .spinner {
            border: 3px solid #eee;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        button {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            font-size: 1.1rem;
            transition: 0.3s;
        }
        button:hover:not(:disabled) {
            background: #007a39;
            transform: translateY(-2px);
        }
        button:disabled { background: #95a5a6; cursor: not-allowed; }

        .register-link {
            margin-top: 20px;
            display: block;
            font-size: 0.9rem;
            color: #7f8c8d;
        }
        .register-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: bold;
        }
        .register-link a:hover { text-decoration: underline; }

        .security-box {
            background: #e8f5e9;
            border: 1px solid var(--safe);
            border-radius: 10px;
            padding: 12px;
            margin: 15px 0;
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }
        .security-text { font-size: 0.8rem; color: #2e7d32; line-height: 1.3; }
        .security-text b { display: block; color: var(--secondary); margin-bottom: 2px; }
    </style>
</head>
<body>

<div class="card">
    <div class="flag-mini">
        <div class="orange"></div>
        <div class="white"></div>
        <div class="green"></div>
    </div>

    <h2>🏗️ BTP PRO CI</h2>
    <p class="subtitle">Connectez-vous à votre espace sécurisé</p>

    <div id="error-box"></div>

    <form onsubmit="event.preventDefault(); gererAuth();">
        <input type="email" id="email" placeholder="Email professionnel" required>
        <input type="password" id="password" placeholder="Mot de passe" required>
        <div class="forgot-password">
            <a href="reset-password.html">Mot de passe oublié ?</a>
        </div>

        <div class="security-box">
            <span style="font-size: 1.5rem;">🛡️</span>
            <div class="security-text">
                <b>Accès Sécurisé RLS Activé</b>
                Vos données sont isolées et protégées par chiffrement.
            </div>
        </div>

        <div id="loader">
            <div class="spinner"></div>
            Connexion en cours...
        </div>

        <button type="submit" id="auth-btn">SE CONNECTER</button>
    </form>

    <span class="register-link">
        Pas encore inscrit ? <a href="inscription.html">Créer un compte</a>
    </span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase.js"></script>
<script>
    async function recupererProfil(userId) {
        const { data, error } = await window.sb
            .from('profiles')
            .select('full_name, role, entreprise_id')
            .eq('id', userId)
            .single();
        if (error) return null;
        return data;
    }

    async function redirigerSiDejaConnecte() {
        const { data: { user } } = await window.sb.auth.getUser();
        if (!user) return;
        const profile = await recupererProfil(user.id);
        if (!profile) return;
        window.location.replace(profile.role === 'pdg' ? 'tableau-de-bord.html' : 'interface-chef.html');
    }

    async function gererAuth() {
        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const errorBox = document.getElementById('error-box');
        const loader   = document.getElementById('loader');
        const btn      = document.getElementById('auth-btn');

        if (!email || !password) {
            errorBox.innerText = "❌ Veuillez remplir tous les champs.";
            errorBox.style.display = "block";
            return;
        }

        btn.disabled = true;
        errorBox.style.display = "none";
        loader.classList.add('visible');

        try {
            const { data: authData, error: authError } = await window.sb.auth.signInWithPassword({ email, password });

            if (authError) throw new Error("Email ou mot de passe incorrect.");
            if (!authData.user) throw new Error("Impossible de se connecter.");

            const profile = await recupererProfil(authData.user.id);
            if (!profile) throw new Error("Profil introuvable. Contactez l'administrateur.");

            localStorage.setItem('user_id',       authData.user.id);
            localStorage.setItem('user_email',    email);
            localStorage.setItem('user_nom',      profile.full_name || 'Utilisateur');
            localStorage.setItem('user_role',     profile.role);
            localStorage.setItem('entreprise_id', profile.entreprise_id || '');

            loader.innerHTML = '✅ Connexion réussie...';

            setTimeout(() => {
                window.location.href = profile.role === 'pdg' ? 'tableau-de-bord.html' : 'chef-accueil.html';
            }, 1000);

        } catch (err) {
            errorBox.innerText = "❌ " + (err.message || "Erreur de connexion.");
            errorBox.style.display = "block";
            loader.classList.remove('visible');
            btn.disabled = false;
        }
    }

    window.addEventListener('load', redirigerSiDejaConnecte);
</script>
</body>
</html>
